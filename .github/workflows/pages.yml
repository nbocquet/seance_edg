name: Publier sur GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v7.0.1
      - name: Préparer le site statique
        run: |
          mkdir _site
          cp index.html style.css app.js salaries.js .nojekyll 'Echelle Traitement 2024.pdf' _site/
          node --check app.js
          node --check salaries.js
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
